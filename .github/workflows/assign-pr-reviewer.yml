name: 'Assign PR reviewer'

# Request a review from an area owner once a PR touches that area's paths.
#
# PR-side companion to assign-issue-owner.yml. Routing is a pure function of
# the PR's changed file paths and .github/issue-owners.json — no model runs in
# this workflow and the script never reads PR title, body, or comments, so
# untrusted PR text cannot select a reviewer. Push access is re-verified
# against the collaborator API before every write. At most one owner is
# requested per PR; if a mapped owner is already a requested reviewer or has
# reviewed, the run no-ops. Fork PRs run with a read-only GITHUB_TOKEN and are
# skipped gracefully — CODEOWNERS still covers them.
#
# This complements CODEOWNERS rather than replacing it: the merge gate keeps
# requesting every code owner, while this workflow surfaces the single most
# relevant owner for day-to-day review attention.

on:
  pull_request:
    types: ['opened', 'synchronize', 'ready_for_review']
  workflow_dispatch:
    inputs:
      number:
        description: 'PR number to evaluate'
        required: true
        type: 'string'
      dry_run:
        description: 'Report the chosen reviewer without requesting'
        required: false
        default: true
        type: 'boolean'

permissions:
  contents: 'read'

concurrency:
  group: 'assign-pr-reviewer-${{ github.event.pull_request.number || inputs.number }}'
  cancel-in-progress: false

jobs:
  request-review:
    if: "${{ github.repository == 'QwenLM/qwen-code' }}"
    runs-on: 'ubuntu-latest'
    timeout-minutes: 5
    permissions:
      contents: 'read'
      issues: 'read'
      pull-requests: 'write'
    steps:
      - name: 'Checkout owner map'
        uses: 'actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10' # v6.0.3
        with:
          sparse-checkout: |-
            .github/issue-owners.json
            .github/scripts/assign-issue-owner.mjs
            .github/scripts/assign-pr-reviewer.mjs
          persist-credentials: false

      - name: 'Request area reviewer'
        env:
          GH_TOKEN: '${{ github.token }}'
          PR_NUMBER: '${{ github.event.pull_request.number || inputs.number }}'
          DRY_RUN: "${{ inputs.dry_run || 'false' }}"
        run: 'node .github/scripts/assign-pr-reviewer.mjs'
